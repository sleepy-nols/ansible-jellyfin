---
- name: Install fail2ban and dependencies
  ansible.builtin.apt:
    pkg:
      - fail2ban
      - iptables

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

- name: Create fail2ban jail
  ansible.builtin.template:
    src: templates/etc/fail2ban/jail.d/jellyfin.j2
    dest: /etc/fail2ban/jail.d/jellyfin.local
    mode: "0644"
  notify: Restart fail2ban
  diff: true

- name: Create fail2ban filter
  ansible.builtin.template:
    src: templates/etc/fail2ban/filter.d/jellyfin.j2
    dest: /etc/fail2ban/filter.d/jellyfin.conf
    mode: "0644"
  notify: Restart fail2ban
  diff: true

- name: Fix debian defaults if backend is not configured yet
  ansible.builtin.lineinfile:
    path: /etc/fail2ban/jail.d/defaults-debian.conf
    line: 'backend = systemd'
    search_string: 'backend = systemd'
    mode: "0644"
  notify: Restart fail2ban
  diff: true
